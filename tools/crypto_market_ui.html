<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto AI Analyzer</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131a2f;
      --soft: #1a2442;
      --text: #edf2ff;
      --muted: #9eb0d6;
      --green: #19c37d;
      --red: #ff5a6f;
      --yellow: #f4c95d;
      --accent: #6ea8fe;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1a2550 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .title {
      font-size: 32px;
      margin: 8px 0 4px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .panel {
      background: rgba(19, 26, 47, 0.95);
      border: 1px solid #22315b;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }

    input, select {
      width: 100%;
      background: var(--soft);
      border: 1px solid #2a3b6f;
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
    }

    .btn {
      background: linear-gradient(90deg, #3478f6, #5e8cff);
      border: 0;
      color: white;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(5, minmax(100px, 1fr));
      gap: 10px;
    }

    .metric {
      background: #111a33;
      border: 1px solid #263764;
      border-radius: 12px;
      padding: 12px;
    }

    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 22px; font-weight: 800; margin-top: 4px; }

    .state { font-weight: 700; color: var(--yellow); }

    .plans {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .plan {
      background: #111a33;
      border: 1px solid #263764;
      border-radius: 14px;
      padding: 14px;
    }

    .buy { border-left: 4px solid var(--green); }
    .sell { border-left: 4px solid var(--red); }

    .row { margin: 6px 0; color: #c9d6f7; font-size: 14px; }
    .row strong { color: #f3f7ff; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }

    .badge.buy { background: rgba(25,195,125,.18); color: #5bffba; }
    .badge.sell { background: rgba(255,90,111,.18); color: #ff9aaa; }

    .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .error { color: #ff9aaa; margin-top: 10px; }

    @media (max-width: 920px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">🚀 Crypto AI Analyzer</div>
    <div class="subtitle">Auto phân tích thị trường + chiến lược Buy/Sell/SL/TP trực quan</div>

    <div class="panel">
      <div class="controls">
        <div>
          <label>Currency</label>
          <input id="currency" value="usd" />
        </div>
        <div>
          <label>Pair Quote</label>
          <input id="quote" value="usdt" />
        </div>
        <div>
          <label>Top Coin</label>
          <input id="top" type="number" min="5" max="250" value="50" />
        </div>
        <div>
          <label>Strategy Limit</label>
          <input id="strategyLimit" type="number" min="1" max="20" value="5" />
        </div>
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="demo">Demo (offline)</option>
            <option value="live">Live API</option>
          </select>
        </div>
        <button class="btn" id="runBtn">Phân tích ngay</button>
      </div>

      <div class="hint">Tip: Nếu môi trường chặn internet, chọn <strong>Demo (offline)</strong>.</div>
      <div id="error" class="error"></div>

      <div class="grid" id="metrics" style="display:none">
        <div class="metric"><div class="k">Market State</div><div class="v state" id="marketState">-</div></div>
        <div class="metric"><div class="k">Total Score</div><div class="v" id="total">-</div></div>
        <div class="metric"><div class="k">Trend</div><div class="v" id="trend">-</div></div>
        <div class="metric"><div class="k">Volatility</div><div class="v" id="volatility">-</div></div>
        <div class="metric"><div class="k">Liquidity</div><div class="v" id="liquidity">-</div></div>
      </div>

      <div class="plans" id="plans"></div>
    </div>
  </div>

  <script>
    const runBtn = document.getElementById('runBtn');
    const errorEl = document.getElementById('error');
    const plansEl = document.getElementById('plans');
    const metricsEl = document.getElementById('metrics');

    function fmt(n) {
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: 6 });
    }

    function planCard(plan) {
      const sideClass = plan.side === 'BUY' ? 'buy' : 'sell';
      return `
      <div class="plan ${sideClass}">
        <div>
          <strong>${plan.name} (${plan.pair || plan.symbol})</strong>
          <span class="badge ${sideClass}">${plan.side}</span>
        </div>
        <div class="row">Confidence: <strong>${plan.confidence}/100</strong></div>
        <div class="row">Entry: <strong>${fmt(plan.entry)}</strong></div>
        <div class="row">SL: <strong>${fmt(plan.sl)}</strong></div>
        <div class="row">TP1: <strong>${fmt(plan.tp1)}</strong> | TP2: <strong>${fmt(plan.tp2)}</strong></div>
        <div class="row">R/R: <strong>${plan.rr1}R</strong> / <strong>${plan.rr2}R</strong></div>
        <div class="row">Invalidation: ${plan.invalidation}</div>
        <div class="row">Note: ${plan.note}</div>
      </div>`;
    }

    async function analyze() {
      errorEl.textContent = '';
      plansEl.innerHTML = '';
      runBtn.disabled = true;
      runBtn.textContent = 'Đang phân tích...';

      const currency = document.getElementById('currency').value || 'usd';
      const top = document.getElementById('top').value || '50';
      const strategyLimit = document.getElementById('strategyLimit').value || '5';
      const quote = document.getElementById('quote').value || 'usdt';
      const demo = document.getElementById('mode').value === 'demo';

      const qs = new URLSearchParams({
        currency,
        top,
        strategy_limit: strategyLimit,
        quote,
        demo: String(demo),
      });

      try {
        const res = await fetch(`/api/analyze?${qs.toString()}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Unknown error');

        metricsEl.style.display = 'grid';
        document.getElementById('marketState').textContent = data.market_state;
        document.getElementById('total').textContent = data.pulse.total;
        document.getElementById('trend').textContent = data.pulse.trend;
        document.getElementById('volatility').textContent = data.pulse.volatility;
        document.getElementById('liquidity').textContent = data.pulse.liquidity;

        plansEl.innerHTML = data.plans.map(planCard).join('');
      } catch (e) {
        errorEl.textContent = `Lỗi: ${e.message}`;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = 'Phân tích ngay';
      }
    }

    runBtn.addEventListener('click', analyze);
    analyze();
  </script>
</body>
</html>
